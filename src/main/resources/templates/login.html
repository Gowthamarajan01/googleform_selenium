<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | Selenium Practice Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card portal-card">
                <div class="card-header text-center">
                    <h1 class="h3 mb-2">Welcome back</h1>
                    <p class="text-secondary mb-0">Log in to view your dashboard.</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div th:if="${param.error}" id="loginError" class="alert alert-danger" role="alert">
                        Invalid username or password. Please try again.
                    </div>
                    <form id="loginForm" th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="username">Username</label>
                            <input class="form-control" id="username" name="username" type="text"
                                   autocomplete="username" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="password">Password</label>
                            <input class="form-control" id="password" name="password" type="password"
                                   autocomplete="current-password" required>
                        </div>
                        <button id="loginBtn" class="btn btn-primary w-100" type="submit">Login</button>
                    </form>
                    <p class="text-center mt-4 mb-0">New User? <a id="registerHereLink" th:href="@{/register}">Register Here</a></p>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
