<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Register | Selenium Practice Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8 col-xl-7">
            <div class="card portal-card">
                <div class="card-header text-center">
                    <h1 class="h3 mb-2">Create your account</h1>
                    <p class="text-secondary mb-0">Add your profile details; username and password are required for login.</p>
                </div>
                <div class="card-body p-4 p-md-5">
                    <div th:if="${param.success}" id="successMessage" class="alert alert-success" role="status">
                        Registration successful! You can now <a th:href="@{/login}">log in</a>.
                    </div>
                    <form id="registrationForm" th:action="@{/register}" th:object="${registrationForm}" method="post">
                        <div class="mb-3">
                            <label class="form-label" for="fullName">Full Name</label>
                            <input class="form-control" id="fullName" name="fullName" th:field="*{fullName}" type="text"
                                   autocomplete="name" maxlength="100">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('fullName')}"
                                 th:errors="*{fullName}"></div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="username">Username <span class="required-mark">*</span></label>
                            <input class="form-control" id="username" name="username" th:field="*{username}" type="text"
                                   autocomplete="username" required minlength="3" maxlength="30">
                            <div class="form-text">3–30 letters, numbers, dots, underscores, or hyphens.</div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('username')}"
                                 th:errors="*{username}"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="password">Password <span class="required-mark">*</span></label>
                                <input class="form-control" id="password" name="password" th:field="*{password}"
                                       type="password" autocomplete="new-password" required minlength="8" maxlength="72">
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('password')}"
                                     th:errors="*{password}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="confirmPassword">Confirm Password <span class="required-mark">*</span></label>
                                <input class="form-control" id="confirmPassword" name="confirmPassword"
                                       th:field="*{confirmPassword}" type="password" autocomplete="new-password" required>
                                <div id="passwordMatchMessage" class="form-text" aria-live="polite"></div>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('confirmPassword')}"
                                     th:errors="*{confirmPassword}"></div>
                            </div>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="dob">Date of Birth</label>
                            <input class="form-control" id="dob" name="dob" th:field="*{dob}" type="date">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('dob')}"
                                 th:errors="*{dob}"></div>
                        </div>
                        <fieldset class="mb-3">
                            <legend class="form-label fs-6">Gender</legend>
                            <div class="d-flex flex-wrap gap-4">
                                <div class="form-check">
                                    <input class="form-check-input" id="genderMale" name="gender" th:field="*{gender}"
                                           type="radio" value="Male">
                                    <label class="form-check-label" for="genderMale">Male</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" id="genderFemale" name="gender" th:field="*{gender}"
                                           type="radio" value="Female">
                                    <label class="form-check-label" for="genderFemale">Female</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" id="genderOther" name="gender" th:field="*{gender}"
                                           type="radio" value="Other">
                                    <label class="form-check-label" for="genderOther">Other</label>
                                </div>
                            </div>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('gender')}"
                                 th:errors="*{gender}"></div>
                        </fieldset>
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="department">Department</label>
                                <select class="form-select" id="department" name="department" th:field="*{department}">
                                    <option value="">Select department</option>
                                    <option value="CSE">CSE</option>
                                    <option value="IT">IT</option>
                                    <option value="ECE">ECE</option>
                                    <option value="EEE">EEE</option>
                                    <option value="MECH">MECH</option>
                                    <option value="CIVIL">CIVIL</option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('department')}"
                                     th:errors="*{department}"></div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label" for="section">Section</label>
                                <select class="form-select" id="section" name="section" th:field="*{section}">
                                    <option value="">Select section</option>
                                    <option value="A">A</option>
                                    <option value="B">B</option>
                                    <option value="C">C</option>
                                    <option value="D">D</option>
                                </select>
                                <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('section')}"
                                     th:errors="*{section}"></div>
                            </div>
                        </div>
                        <div class="form-check mb-3">
                            <input class="form-check-input" id="receiveUpdates" name="receiveUpdates"
                                   th:field="*{receiveUpdates}" type="checkbox">
                            <label class="form-check-label" for="receiveUpdates">
                                Send me occasional Selenium practice tips.
                            </label>
                        </div>
                        <div class="d-flex gap-2 mt-3">
                            <button id="registerBtn" class="btn btn-primary" type="submit">Submit</button>
                            <button id="resetBtn" class="btn btn-outline-secondary" type="reset">Reset</button>
                        </div>
                    </form>
                    <p class="text-center mt-4 mb-0">Already Registered? <a id="loginHereLink" th:href="@{/login}">Login Here</a></p>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
<script th:src="@{/js/registration.js}"></script>
</body>
</html>
