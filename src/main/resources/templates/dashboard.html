<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard | Selenium Practice Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" th:href="@{/dashboard}">Selenium Practice Portal</a>
        <form th:action="@{/logout}" method="post">
            <button id="logoutBtn" class="btn btn-outline-light" type="submit">Logout</button>
        </form>
    </div>
</nav>
<main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card portal-card">
                <div class="card-body p-4 p-md-5">
                    <h1 class="h3">Welcome, <span id="welcomeUsername" th:text="${portalUser.username}">username</span>!</h1>
                    <p class="text-secondary mb-4">Here is your registered profile information.</p>
                    <div class="table-responsive">
                        <table id="profileTable" class="table table-bordered profile-table align-middle mb-0">
                            <tbody>
                            <tr><th scope="row">Full Name</th><td id="profileFullName" th:text="${portalUser.fullName}"></td></tr>
                            <tr><th scope="row">Username</th><td id="profileUsername" th:text="${portalUser.username}"></td></tr>
                            <tr><th scope="row">Date of Birth</th><td id="profileDob" th:text="${portalUser.dob}"></td></tr>
                            <tr><th scope="row">Gender</th><td id="profileGender" th:text="${portalUser.gender}"></td></tr>
                            <tr><th scope="row">Department</th><td id="profileDepartment" th:text="${portalUser.department}"></td></tr>
                            <tr><th scope="row">Section</th><td id="profileSection" th:text="${portalUser.section}"></td></tr>
                            <tr><th scope="row">Practice Tips</th><td id="profileReceiveUpdates"
                                th:text="${portalUser.receiveUpdates ? 'Subscribed' : 'Not subscribed'}"></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
