<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selenium Practice Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
    <section class="hero">
        <span class="badge text-bg-primary mb-3">Learn by doing</span>
        <h1 class="display-4">Selenium Practice Portal</h1>
        <p class="lead mx-auto my-4" style="max-width: 42rem">
            Welcome! Create an account, explore your dashboard, and practice automating a real web application.
        </p>
        <div th:if="${param.logout}" id="logoutMessage" class="alert alert-success mx-auto" style="max-width: 32rem">
            You have been logged out successfully.
        </div>
        <div class="d-flex flex-column flex-sm-row justify-content-center align-items-center gap-3 mt-4">
            <a id="homeRegisterBtn" class="btn btn-primary btn-lg px-4" th:href="@{/register}">Register</a>
            <a id="homeLoginBtn" class="btn btn-outline-primary btn-lg px-4" th:href="@{/login}">Already Registered? Login</a>
        </div>
    </section>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
